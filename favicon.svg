<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bioRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield / Tile Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#09090d" stroke="#22222e" stroke-width="2" />
  
  <!-- Subtle Grid Pattern in Icon -->
  <path d="M12 2v60M24 2v60M36 2v60M48 2v60M2 12h60M2 24h60M2 36h60M2 48h60" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Code Bracket Left '<' -->
  <path d="M18 24 L10 32 L18 40" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Biomedical ECG Pulse Waveform (Center) -->
  <path d="M20 32 L25 32 L28 20 L33 44 L37 26 L40 35 L44 32" fill="none" stroke="url(#bioRed)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Heartbeat Peak Node Indicator -->
  <circle cx="33" cy="44" r="2.5" fill="#ef4444" filter="url(#glow)" />
  <circle cx="28" cy="20" r="2" fill="#fca5a5" />

  <!-- Code Bracket Right '>' -->
  <path d="M46 24 L54 32 L46 40" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
